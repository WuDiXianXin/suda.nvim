name: "功能建议 (Feature request · 中文)"
description: "建议新功能或改进现有行为"
title: "[Feature]: "
labels: ["enhancement", "lang:zh"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 当前缺少什么，或哪里不好用？
      placeholder: "例如：希望在 Windows 上用 gsudo 编辑受保护文件"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 理想中的行为或 API 形态
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 主要相关平台
      options:
        - Linux
        - macOS
        - Windows
        - 全部 / 不限
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 是否愿意提交 PR、参考的其他插件等
    validations:
      required: false
